name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  SAM_STACK_NAME: ${{ vars.SAM_STACK_NAME || 'henshin-tamago' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend test
        working-directory: frontend
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Backend test
        run: python -m pytest backend -q

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: >-
          sam deploy
          --template-file .aws-sam/build/template.yaml
          --stack-name ${{ env.SAM_STACK_NAME }}
          --region ${{ env.AWS_REGION }}
          --capabilities CAPABILITY_IAM
          --resolve-s3
          --parameter-overrides
          DomainName=${{ vars.DOMAIN_NAME }}
          AcmCertificateArn=${{ vars.ACM_CERTIFICATE_ARN }}
          --no-confirm-changeset
          --no-fail-on-empty-changeset

      - name: Read stack outputs
        id: stack
        run: |
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "${SAM_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].Outputs' \
            --output json)
          echo "api_url=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="ApiFunctionUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "bucket=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "site_url=$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="SiteUrl") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.stack.outputs.api_url }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.stack.outputs.bucket }}" \
            --delete \
            --cache-control 'public, max-age=31536000, immutable' \
            --exclude 'index.html' \
            --exclude 'manifest.webmanifest' \
            --exclude 'sw.js' \
            --exclude 'registerSW.js'
          aws s3 cp frontend/dist/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --cache-control 'no-cache'
          for f in manifest.webmanifest sw.js registerSW.js; do
            if [ -f "frontend/dist/$f" ]; then
              aws s3 cp "frontend/dist/$f" "s3://${{ steps.stack.outputs.bucket }}/$f" --cache-control 'no-cache'
            fi
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution_id }}" \
            --paths '/*'

      - name: Summary
        run: |
          echo "### デプロイ完了 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.stack.outputs.site_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.stack.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
